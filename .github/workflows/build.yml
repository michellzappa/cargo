name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      # HouseKit is a sibling path dependency (../housekit) in project.yml.
      - uses: actions/checkout@v4
        with:
          repository: michellzappa/housekit
          path: housekit
      - uses: actions/checkout@v4
        with:
          repository: michellzappa/easysubs
          path: easysubs
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: xcodebuild build -project Cargo.xcodeproj -scheme Cargo -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
      - name: Test
        run: xcodebuild test -project Cargo.xcodeproj -scheme Cargo -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
      # Release is what ships; -O and strict concurrency can fail where Debug passes.
      - name: Build (Release)
        run: xcodebuild build -project Cargo.xcodeproj -scheme Cargo -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
