name: Cargo
options:
  bundleIdPrefix: app.cargo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  HouseKit:
    path: ../housekit
  EasySubsKit:
    path: ../easysubs
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    version: 2.103.0
  CargoRemoteKit:
    path: Packages/CargoRemoteKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Same lesson as Tessellate: TCC and Keychain key their grants to the code
    # signature, so an ad-hoc build loses them on every rebuild. Sign with the
    # stable Apple Development identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 992N457T8D
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    # Both are overridden on the command line by scripts/build-app.sh and the
    # release workflow (see scripts/build-number.sh); Xcode-only builds get these.
    CURRENT_PROJECT_VERSION: "0"
    CARGO_COMMIT: xcode
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Cargo:
    type: application
    platform: macOS
    sources:
      - path: Sources/Cargo
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: HouseKit
        product: HouseKit
      - package: EasySubsKit
        product: EasySubsKit
      - package: SwiftNIO
        products:
          - NIOCore
          - NIOHTTP1
          - NIOPosix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cargo.Cargo
        PRODUCT_NAME: Cargo
        CODE_SIGN_ENTITLEMENTS: Resources/Cargo.entitlements
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
  CargoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CargoTests
    dependencies:
      - target: Cargo
  CargoIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CargoIOS
    dependencies:
      - package: CargoRemoteKit
        product: CargoRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cargo.CargoIOS
        PRODUCT_NAME: Cargo
        INFOPLIST_FILE: Resources/CargoIOS-Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
schemes:
  Cargo:
    build:
      targets:
        Cargo: all
        CargoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CargoTests
    profile:
      config: Release
    archive:
      config: Release
  CargoIOS:
    build:
      targets:
        CargoIOS: all
    run:
      config: Debug
    archive:
      config: Release
